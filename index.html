<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 手工形态汇总匹配工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #1976d2;
        }
        
        .loading-status {
            text-align: center;
            padding: 10px;
            color: #666;
            font-size: 14px;
        }
        
        .input-section {
            margin-bottom: 30px;
        }
        
        .paste-section {
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 2px dashed #667eea;
        }
        
        .paste-section label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }
        
        .paste-section textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            min-height: 80px;
            transition: all 0.3s;
        }
        
        .paste-section textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .paste-section .paste-hint {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            font-style: italic;
        }
        
        .btn-parse {
            background: #4caf50;
            color: white;
            margin-top: 10px;
        }
        
        .btn-parse:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }
        
        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
        }
        
        .input-group label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
            font-weight: 500;
        }
        
        .input-group input {
            padding: 8px 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .input-group.required label::after {
            content: ' *';
            color: #e74c3c;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }
        
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-check {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-check:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-check:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-clear {
            background: #e0e0e0;
            color: #333;
        }
        
        .btn-clear:hover {
            background: #d0d0d0;
        }
        
        .result-section {
            margin-top: 30px;
            display: none;
        }
        
        .result-section.show {
            display: block;
        }
        
        .result-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        
        .result-card.matched {
            background: #e8f5e9;
            border-left-color: #4caf50;
        }
        
        .result-card.not-matched {
            background: #ffebee;
            border-left-color: #f44336;
        }
        
        .result-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }
        
        .result-status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .status-matched {
            background: #4caf50;
            color: white;
        }
        
        .status-not-matched {
            background: #f44336;
            color: white;
        }
        
        .rules-list {
            margin-top: 15px;
        }
        
        .rule-item {
            background: white;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 13px;
            border: 1px solid #e0e0e0;
        }
        
        .rule-item.pred-shang {
            border-left: 4px solid #4caf50;
        }
        
        .rule-item.pred-xia {
            border-left: 4px solid #ff9800;
        }
        
        .rule-item strong {
            color: #667eea;
        }
        
        .prediction-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
        }
        
        .prediction-badge.shang {
            background: #4caf50;
            color: white;
        }
        
        .prediction-badge.xia {
            background: #ff9800;
            color: white;
        }
        
        .prediction-badge.zou {
            background: #9e9e9e;
            color: white;
        }
        
        .rules-group {
            margin-top: 15px;
        }
        
        .rules-group-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Scatter plot section */
        .scatter-section {
            margin-top: 30px;
        }

        .scatter-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #667eea;
        }

        .scatter-input-area {
            margin-bottom: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 2px dashed #667eea;
        }

        .scatter-input-area label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .scatter-input-area textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            min-height: 60px;
            transition: all 0.3s;
        }

        .scatter-input-area textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .scatter-btn-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .scatter-btn-row button {
            padding: 10px 24px;
            font-size: 14px;
        }

        .btn-scatter-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-scatter-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-scatter-filter {
            background: #ff9800;
            color: white;
        }

        .btn-scatter-filter:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.4);
        }

        .btn-scatter-reset {
            background: #e0e0e0;
            color: #333;
        }

        .btn-scatter-reset:hover {
            background: #d0d0d0;
        }

        .scatter-morph-info {
            margin-left: 15px;
            font-size: 13px;
            color: #666;
        }

        .scatter-legend {
            display: flex;
            gap: 18px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            font-size: 13px;
            align-items: center;
        }

        .scatter-legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .scatter-legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .scatter-charts-wrap {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        @media (max-width: 900px) {
            .scatter-charts-wrap { grid-template-columns: repeat(3, 1fr); }
        }

        .scatter-chart-box {
            text-align: center;
            cursor: pointer;
        }
        .scatter-chart-box canvas {
            width: 100% !important;
            height: auto !important;
            aspect-ratio: 1;
        }

        .scatter-chart-box .chart-label {
            font-size: 12px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        /* Scatter modal */
        .scatter-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .scatter-modal-overlay.show { display: flex; }
        .scatter-modal {
            position: relative;
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            max-width: 90vw;
            max-height: 90vh;
            text-align: center;
        }
        .scatter-modal .modal-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .scatter-modal canvas {
            max-width: 80vmin;
            max-height: 80vmin;
        }
        .scatter-modal-close {
            position: absolute;
            top: 8px; right: 14px;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            background: none; border: none;
        }
        .scatter-modal-close:hover { color: #333; }
        .scatter-modal-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 36px;
            cursor: pointer;
            color: #667eea;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 50%;
            width: 48px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .scatter-modal-arrow:hover { background: #667eea; color: #fff; }
        .scatter-modal-arrow.left { left: -60px; }
        .scatter-modal-arrow.right { right: -60px; }

        .normal-dist-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        @media (max-width: 900px) {
            .normal-dist-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .normal-dist-box {
            text-align: center;
        }
        .normal-dist-box canvas {
            width: 100% !important;
            height: auto !important;
        }
        .normal-dist-box .chart-label {
            font-size: 12px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        /* 趋势分析面板 */
        .trend-panel {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .trend-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 14px;
            font-size: 14px;
        }
        .trend-table th {
            background: #f5f6fa;
            padding: 8px 10px;
            text-align: center;
            font-weight: 600;
            border-bottom: 2px solid #e0e0e0;
        }
        .trend-table td {
            padding: 8px 10px;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
        }
        .trend-table .level-label { font-weight: 600; text-align: left; }
        .trend-bar-wrap {
            display: flex;
            height: 22px;
            border-radius: 4px;
            overflow: hidden;
            min-width: 120px;
        }
        .trend-bar-up { background: #e53935; }
        .trend-bar-dn { background: #4caf50; }
        .trend-bar-zou { background: #ff9800; }
        .trend-drift {
            font-weight: 700;
            font-size: 13px;
        }
        .trend-drift.up { color: #e53935; }
        .trend-drift.dn { color: #4caf50; }
        .trend-drift.flat { color: #999; }
        .trend-conclusion {
            margin-top: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
        }
        .trend-conclusion.strong { background: #e8f5e9; border-left: 4px solid #4caf50; }
        .trend-conclusion.moderate { background: #fff8e1; border-left: 4px solid #ff9800; }
        .trend-conclusion.weak { background: #fce4ec; border-left: 4px solid #e53935; }
    </style>
</head>
<body>
    <div class="container">
        <h1>2026 手工形态汇总匹配工具</h1>
        <p class="subtitle">输入指定列数据，匹配「2026 手工形态汇总类型库（已人工验证）」</p>
        
        <div class="info-box">
            <strong>说明：</strong>
            <ul style="margin: 10px 0 0 20px;">
                <li>先按主/客 + 盘口组合（B/D/F）匹配到汇总分组，再按每行条件逐条比对</li>
                <li>命中后展示：预测、上/走/下、标注、提示</li>
            </ul>
            <div style="margin-top:10px;text-align:right;">
                <a href="manage.html" style="color:#1976d2;font-weight:600;text-decoration:none;">规则管理 →</a>
            </div>
        </div>
        
        <div class="loading-status" id="loadingStatus">正在加载 2026 汇总类型库...</div>
        
        <div class="input-section" id="inputSection" style="display: none;">
            <div class="paste-section">
                <label for="pasteData">快速粘贴（按列顺序：A B C D E F G H I K L M O P Q U V W X，用制表符或空格分隔）：</label>
                <textarea id="pasteData" placeholder="例如：英超	客	4	0	0.8	0	0.78	0	0.02	2.4	3.1	2.7	2.39	2.9	2.74	-0.01	-0.20	0.04	0.15"></textarea>
                <p class="paste-hint">💡 提示：从Excel或表格中复制整行数据，然后粘贴到上方文本框，点击"解析数据"按钮即可自动填充</p>
                <button class="btn-parse" onclick="parsePastedData()">解析数据</button>
            </div>
            
            <div class="input-grid">
                <div class="input-group">
                    <label>A (强队)</label>
                    <input type="text" id="A" placeholder="强队">
                </div>
                <div class="input-group required">
                    <label>B (弱队/主客)</label>
                    <input type="text" id="B" placeholder="主/客" required>
                </div>
                <div class="input-group">
                    <label>C (时间)</label>
                    <input type="text" id="C" placeholder="时间">
                </div>
                <div class="input-group required">
                    <label>D (澳门)</label>
                    <input type="text" id="D" placeholder="0" required>
                </div>
                <div class="input-group">
                    <label>E (上水)</label>
                    <input type="text" id="E" placeholder="数值">
                </div>
                <div class="input-group required">
                    <label>F (马会)</label>
                    <input type="text" id="F" placeholder="0" required>
                </div>
                <div class="input-group">
                    <label>G (上水)</label>
                    <input type="text" id="G" placeholder="数值">
                </div>
                <div class="input-group">
                    <label>H (盘差)</label>
                    <input type="text" id="H" placeholder="数值">
                </div>
                <div class="input-group">
                    <label>I (水差)</label>
                    <input type="text" id="I" placeholder="数值">
                </div>
                <div class="input-group">
                    <label>K</label>
                    <input type="text" id="K" placeholder="数值">
                </div>
                <div class="input-group">
                    <label>L（澳）</label>
                    <input type="text" id="L" placeholder="数值">
                </div>
                <div class="input-group">
                    <label>M (马)</label>
                    <input type="text" id="M" placeholder="数值">
                </div>
                <div class="input-group">
                    <label>O</label>
                    <input type="text" id="O" placeholder="数值">
                </div>
                <div class="input-group">
                    <label>P（马）</label>
                    <input type="text" id="P" placeholder="数值">
                </div>
                <div class="input-group">
                    <label>Q</label>
                    <input type="text" id="Q" placeholder="数值">
                </div>
                <div class="input-group">
                    <label>U（主差）</label>
                    <input type="text" id="U" placeholder="数值">
                </div>
                <div class="input-group">
                    <label>V（平差）</label>
                    <input type="text" id="V" placeholder="数值">
                </div>
                <div class="input-group">
                    <label>W（客差）</label>
                    <input type="text" id="W" placeholder="数值">
                </div>
                <div class="input-group">
                    <label>X（澳平客差）</label>
                    <input type="text" id="X" placeholder="数值">
                </div>
            </div>
            
            <div class="button-group">
                <button class="btn-check" id="btnCheck" onclick="checkData()">判断</button>
                <button class="btn-clear" onclick="clearData()">清空</button>
            </div>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>正在分析...</div>
        </div>
        
        <div class="result-section" id="resultSection">
            <div class="result-card" id="summaryResult">
                <div class="result-title">2026 手工形态汇总类型库（已人工验证）</div>
                <div class="result-status" id="summaryStatus"></div>
                <div class="rules-list" id="summaryRules"></div>
            </div>
        </div>

        <!-- Scatter plot section -->
        <div class="scatter-section" id="scatterSection">
            <div class="scatter-title">散点图分析</div>
            <div class="scatter-input-area">
                <div class="scatter-btn-row">
                    <button class="btn-scatter-add" onclick="scatterAdd()">添加比赛（使用上方数据）</button>
                    <button class="btn-scatter-filter" onclick="scatterFilter('coarse')" id="btnScatterCoarse" style="display:none;">初筛</button>
                    <button class="btn-scatter-filter" onclick="scatterFilter('fine')" id="btnScatterFine" style="display:none;">细筛</button>
                    <button class="btn-scatter-reset" onclick="scatterReset()" id="btnScatterReset" style="display:none;">重置</button>
                    <span class="scatter-morph-info" id="scatterMorphInfo"></span>
                </div>
            </div>
            <div class="scatter-legend" id="scatterLegend" style="display:none;">
                <span class="scatter-legend-item"><span class="scatter-legend-dot" style="background:#e53935;"></span> 上</span>
                <span class="scatter-legend-item"><span class="scatter-legend-dot" style="background:#4caf50;"></span> 下</span>
                <span class="scatter-legend-item"><span class="scatter-legend-dot" style="background:#ff9800;"></span> 走</span>
                <span class="scatter-legend-item"><span class="scatter-legend-dot" style="background:#2196f3;width:14px;height:14px;"></span> 未赛（当前输入）</span>
            </div>
            <div class="scatter-charts-wrap" id="scatterChartsWrap"></div>
            <div id="scatterLineChartWrap" style="display:none; margin-top:18px;">
                <div id="lineChartTitle" style="font-weight:700; font-size:14px; margin-bottom:6px; color:#333;">折线总览</div>
                <canvas id="scatterLineCanvas" style="width:100%; border:1px solid #e0e0e0; border-radius:6px; background:#fafafa;"></canvas>
            </div>
            <!-- 趋势分析面板 -->
            <div id="trendAnalysisWrap" style="display:none; margin-top:18px;">
                <div style="font-weight:700; font-size:15px; margin-bottom:10px; color:#333;">📊 趋势分析</div>
                <div class="trend-panel" id="trendPanel"></div>
            </div>
            <!-- 正态分布图 -->
            <div id="normalDistWrap" style="display:none; margin-top:18px;">
                <div style="font-weight:700; font-size:15px; margin-bottom:10px; color:#333;">📈 正态分布分析（全部数据）</div>
                <div class="normal-dist-grid" id="normalDistGrid"></div>
            </div>
            <div id="normalDistCoarseWrap" style="display:none; margin-top:18px;">
                <div id="normalDistCoarseTitle" style="font-weight:700; font-size:15px; margin-bottom:10px; color:#333;">📈 正态分布分析（初筛数据）</div>
                <div class="normal-dist-grid" id="normalDistCoarseGrid"></div>
            </div>
        </div>
    </div>

    <!-- Normal dist modal -->
    <div class="scatter-modal-overlay" id="normDistModal">
        <div class="scatter-modal">
            <button class="scatter-modal-close" onclick="closeNormDistModal()">&times;</button>
            <button class="scatter-modal-arrow left" onclick="normDistModalNav(-1)">&#8249;</button>
            <button class="scatter-modal-arrow right" onclick="normDistModalNav(1)">&#8250;</button>
            <div class="modal-title" id="normDistModalTitle"></div>
            <canvas id="normDistModalCanvas" width="600" height="420"></canvas>
        </div>
    </div>

    <!-- Scatter modal -->
    <div class="scatter-modal-overlay" id="scatterModal">
        <div class="scatter-modal">
            <button class="scatter-modal-close" onclick="closeScatterModal()">&times;</button>
            <button class="scatter-modal-arrow left" onclick="scatterModalNav(-1)">&#8249;</button>
            <button class="scatter-modal-arrow right" onclick="scatterModalNav(1)">&#8250;</button>
            <div class="modal-title" id="scatterModalTitle"></div>
            <canvas id="scatterModalCanvas" width="600" height="600"></canvas>
        </div>
    </div>

        <script>
        let summaryTypesData = null;
        
        // 加载 2026 手工形态汇总类型库
        async function loadSummaryTypes() {
            try {
                const response = await fetch('static/summary_types_v2.json');
                if (!response.ok) {
                    throw new Error('无法加载汇总类型库（static/summary_types_v2.json）');
                }
                summaryTypesData = await response.json();
                const meta = summaryTypesData.meta || {};
                document.getElementById('loadingStatus').textContent = `2026 汇总类型库已加载（共 ${meta.total_types || 0} 条）`;
                document.getElementById('inputSection').style.display = 'block';
            } catch (error) {
                document.getElementById('loadingStatus').textContent = '2026 汇总类型库加载失败：' + error.message;
                document.getElementById('loadingStatus').style.color = '#f44336';
            }
        }
        
        async function checkData() {
            if (!summaryTypesData) {
                alert('汇总类型库尚未加载，请稍候...');
                return;
            }
            
            // 收集数据
            const data = {};
            const columns = ['A','B','C','D','E','F','G','H','I','K','L','M','O','P','Q','U','V','W','X'];
            for (let col of columns) {
                const input = document.getElementById(col);
                const val = input.value.trim();
                data[col] = val || null;
            }
            
            // 验证必填字段
            if (!data['B'] || !data['D'] || !data['F']) {
                alert('请填写必填字段：B(主客)、D(澳门)、F(马会)');
                return;
            }
            
            // 验证形态
            if (data['B'] !== '主' && data['B'] !== '客') {
                alert('B列必须是"主"或"客"');
                return;
            }
            
            // 显示加载
            document.getElementById('loading').classList.add('show');
            document.getElementById('resultSection').classList.remove('show');
            document.getElementById('btnCheck').disabled = true;
            
            // 使用setTimeout模拟异步，避免阻塞UI
            setTimeout(() => {
                try {
                    // 检查 2026 汇总类型库匹配
                    const summaryMatched = checkSummaryTypes(data);

                    // 显示结果
                    displayResult({
                        summary: {
                            matched: summaryMatched.length > 0,
                            count: summaryMatched.length,
                            types: summaryMatched
                        },
                        rowData: data
                    });
                } catch (error) {
                    alert('判断出错：' + error.message);
                } finally {
                    document.getElementById('loading').classList.remove('show');
                    document.getElementById('btnCheck').disabled = false;
                }
            }, 100);
        }
        
        function displayResult(result) {
            const inputData = result.rowData || {};

            // 2026 手工汇总类型库
            const summary = result.summary;
            const summaryCard = document.getElementById('summaryResult');
            const summaryStatus = document.getElementById('summaryStatus');
            const summaryRules = document.getElementById('summaryRules');

            if (!summary || !summary.matched) {
                summaryCard.className = 'result-card not-matched';
                summaryStatus.className = 'result-status status-not-matched';
                summaryStatus.textContent = '✗ 当前数据未命中任何 2026 汇总类型';
                summaryRules.innerHTML = '';
            } else {
                summaryCard.className = 'result-card matched';
                summaryStatus.className = 'result-status status-matched';
                summaryStatus.textContent = `✓ 命中 ${summary.count} 条 2026 汇总类型`;

                let html = '';
                for (const t of summary.types) {
                    const s = t.stats || {};
                    const shang = s.shang || 0;
                    const zou = s.zou || 0;
                    const xia = s.xia || 0;
                    const nEff = shang + xia;
                    const nTotal = shang + xia + zou;
                    const mark = t.mark || '';
                    const tip = t.tip || '';
                    let rec = '无明显推荐';
                    let recClass = 'prediction-badge';
                    if (nEff > 0 && shang / nEff > 0.8) {
                        rec = '推荐：上';
                        recClass = 'prediction-badge shang';
                    } else if (nEff > 0 && xia / nEff > 0.8) {
                        rec = '推荐：下';
                        recClass = 'prediction-badge xia';
                    } else if (nTotal > 0 && zou / nTotal === 1) {
                        rec = '推荐：走';
                        recClass = 'prediction-badge zou';
                    }

                    html += `
                        <div class="rule-item">
                            <strong>形态：</strong>${(t.morph || []).join('/')}（分组：${t.group}）<br>
                            <strong>特征：</strong>${t.feature_text || '（无）'}
                            ${rec !== '无明显推荐' ? `<span class="${recClass}">${rec}</span>` : ''}<br>
                            <strong>预测：</strong>${t.prediction || '（无）'}<br>
                            <strong>统计：</strong>上${shang} 下${xia} 走${zou}<br>
                            <strong>AI统计：</strong>${(() => {
                                const ai = t.ai_stats || {};
                                const aiS = ai.shang || 0, aiZ = ai.zou || 0, aiX = ai.xia || 0;
                                const match = (aiS === shang && aiZ === zou && aiX === xia);
                                const color = match ? '#4caf50' : '#e53935';
                                return '<span style="color:' + color + '">上' + aiS + ' 下' + aiX + ' 走' + aiZ + (match ? ' ✓' : ' ✗') + '</span>';
                            })()}<br>
                            <strong>数据范围：</strong>${(() => {
                                const pr = t.pred_ranges || {};
                                const cols = Object.keys(pr);
                                if (cols.length === 0) return '<span style="color:#999">无历史数据</span>';
                                const exceeded = [];
                                for (const col of cols) {
                                    const r = pr[col];
                                    const v = parseFloat(inputData[col]);
                                    if (isNaN(v)) continue;
                                    if (v < r.min || v > r.max) {
                                        const dir = v < r.min ? '低于' : '高于';
                                        exceeded.push(r.name + '超出（' + v + ' ' + dir + ' ' + r.min + '~' + r.max + '）');
                                    }
                                }
                                if (exceeded.length === 0) {
                                    return '<span style="color:#4caf50">范围内</span>';
                                }
                                return '<span style="color:#e53935">' + exceeded.join('，') + '</span>';
                            })()}<br>
                            ${mark ? `<strong>标注：</strong>${mark}<br>` : ''}
                            ${tip ? `<span style="color:#e53935;font-weight:600"><strong>提示：</strong>${tip}</span>` : ''}
                        </div>
                    `;
                }

                summaryRules.innerHTML = html;
            }

            document.getElementById('resultSection').classList.add('show');
        }

        // 使用 2026 汇总类型库判断当前行是否命中人工验证类型
        function checkSummaryTypes(rowData) {
            const matched = [];
            if (!summaryTypesData || !summaryTypesData.types) {
                return matched;
            }

            const B = String(rowData.B || '').trim();
            const D = String(rowData.D || '').trim();
            const F = String(rowData.F || '').trim();

            if (B !== '主' && B !== '客') return matched;

            const morph = [B, D, F];

            function getNum(col) {
                const val = rowData[col];
                if (val === null || val === undefined || val === '') return null;
                const num = parseFloat(val);
                return isNaN(num) ? null : num;
            }

            const vals = {
                G: getNum('G'), // 汇总:马会 -> 输入G(上水)
                I: getNum('I'), // 汇总:水差 -> 输入I
                L: getNum('L'), // 汇总:澳平 -> 输入L(澳)
                O: getNum('O'), // 汇总:马主 -> 输入O
                P: getNum('P'), // 汇总:马平 -> 输入P(马)
                U: getNum('U'), // 汇总:主差 -> 输入U
                V: getNum('V'), // 汇总:平差 -> 输入V
                W: getNum('W'), // 汇总:客差 -> 输入W
                X: getNum('X')  // 汇总:澳平客差 -> 输入X
            };

            const EPS = 1e-9;
            for (const t of summaryTypesData.types) {
                const tm = t.morph || [];
                if (tm.length !== 3) continue;
                if (tm[0] !== morph[0] || tm[1] !== morph[1] || tm[2] !== morph[2]) {
                    continue;
                }

                const conds = t.conditions || {};
                let ok = true;
                outer: for (const [colName, condList] of Object.entries(conds)) {
                    const v = vals[colName];
                    if (v === null || v === undefined) {
                        ok = false;
                        break;
                    }
                    for (const c of condList) {
                        const op = c.op;
                        const val = c.value;
                        if (op === '>=') {
                            if (!(v >= val)) { ok = false; break outer; }
                        } else if (op === '<=') {
                            if (!(v <= val)) { ok = false; break outer; }
                        } else if (op === '>') {
                            if (!(v > val)) { ok = false; break outer; }
                        } else if (op === '<') {
                            if (!(v < val)) { ok = false; break outer; }
                        } else if (op === '=') {
                            if (!(Math.abs(v - val) <= EPS)) { ok = false; break outer; }
                        }
                    }
                }

            if (ok) {
                matched.push(t);
            }
        }

        return matched;
    }


        function parsePastedData() {
            const pasteText = document.getElementById('pasteData').value.trim();
            if (!pasteText) {
                alert('请先粘贴数据');
                return;
            }
            
            // 尝试按制表符分割，如果没有制表符则按多个空格分割
            let parts = pasteText.split(/\t/);
            if (parts.length === 1) {
                // 如果没有制表符，尝试按多个空格分割
                parts = pasteText.split(/\s+/);
            }
            
            // 清理每个部分（去除首尾空格）
            parts = parts.map(p => p.trim()).filter(p => p.length > 0);
            
            // 验证数据数量（共19列：A B C D E F G H I K L M O P Q U V W X）
            if (parts.length < 19) {
                alert(`数据列数不足：期望19列（A B C D E F G H I K L M O P Q U V W X），实际${parts.length}列。\n\n请确保数据完整，列之间用制表符或空格分隔。`);
                return;
            }
            
            if (parts.length > 19) {
                alert(`数据列数过多：期望19列（A B C D E F G H I K L M O P Q U V W X），实际${parts.length}列。\n\n将使用前19列数据。`);
            }
            
            // 填充到各个输入框
            const columns = ['A','B','C','D','E','F','G','H','I','K','L','M','O','P','Q','U','V','W','X'];
            for (let i = 0; i < 19 && i < parts.length; i++) {
                const col = columns[i];
                const input = document.getElementById(col);
                if (input) {
                    input.value = parts[i];
                }
            }
            
            // 提示成功
            const hint = document.querySelector('.paste-hint');
            const originalText = hint.textContent;
            hint.textContent = '✓ 数据已成功解析并填充！';
            hint.style.color = '#4caf50';
            setTimeout(() => {
                hint.textContent = originalText;
                hint.style.color = '#666';
            }, 2000);
        }
        
        function clearData() {
            // 清空粘贴框
            document.getElementById('pasteData').value = '';
            // 清空所有输入框
            const columns = ['A','B','C','D','E','F','G','H','I','K','L','M','O','P','Q','U','V','W','X'];
            for (let col of columns) {
                document.getElementById(col).value = '';
            }
            document.getElementById('resultSection').classList.remove('show');
        }
        
        // 回车键提交
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
                checkData();
            }
            // 在粘贴框中按Ctrl+Enter或Cmd+Enter解析
            if (e.key === 'Enter' && e.target.id === 'pasteData' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                parsePastedData();
            }
        });
        
        // 页面加载时加载汇总类型库
        loadSummaryTypes();

        // ========== Scatter Plot Section ==========
        let scatterDataCache = null;
        let scatterCurrentMatch = null;   // {B, D, F, vals:{E,G,L,P,U,W,X}}
        let scatterGroupRows = null;      // array of rows from matched group
        let scatterFiltered = null;

        const SCATTER_COLS = ['E','G','L','P','U','W','X'];
        const SCATTER_COL_NAMES = {E:"澳上水", G:"马上水", L:"澳平", P:"马平", U:"主差", W:"客差", X:"澳平客差"};
        const SCATTER_RESULT_COLORS = {"上":"#e53935", "下":"#4caf50", "走":"#ff9800"};

        async function loadScatterData() {
            if (scatterDataCache) return scatterDataCache;
            const resp = await fetch('static/scatter_data.json');
            if (!resp.ok) throw new Error('无法加载 scatter_data.json');
            scatterDataCache = await resp.json();
            return scatterDataCache;
        }

        function parseScatterRow(text) {
            let parts = text.trim().split(/\t/);
            if (parts.length === 1) parts = text.trim().split(/\s+/);
            parts = parts.map(p => p.trim()).filter(p => p.length > 0);
            if (parts.length < 19) {
                throw new Error('数据列数不足：期望19列，实际' + parts.length + '列');
            }
            const columns = ['A','B','C','D','E','F','G','H','I','K','L','M','O','P','Q','U','V','W','X'];
            const data = {};
            for (let i = 0; i < 19; i++) {
                data[columns[i]] = parts[i];
            }
            return data;
        }

        async function scatterAdd() {
            const text = document.getElementById('pasteData').value.trim();
            if (!text) { alert('请先在上方快速粘贴框中粘贴比赛数据'); return; }

            let data;
            try { data = parseScatterRow(text); } catch(e) { alert(e.message); return; }

            const B = data.B;
            const D = data.D;
            const F = data.F;

            if (B !== '主' && B !== '客') { alert('B列必须是"主"或"客"'); return; }
            if (parseFloat(F) >= 1.5) { alert('马会让球数≥1.5，不予显示'); return; }

            const vals = {};
            for (const c of SCATTER_COLS) {
                vals[c] = parseFloat(data[c]);
                if (isNaN(vals[c])) { alert('列 ' + c + ' 数据无效'); return; }
            }

            scatterCurrentMatch = { B, D, F, vals };

            let sd;
            try { sd = await loadScatterData(); } catch(e) { alert(e.message); return; }

            const morphKey = B + '|' + D + '|' + F;
            const group = sd.groups[morphKey];
            if (!group || group.length === 0) {
                alert('未找到形态分组：' + morphKey);
                return;
            }

            scatterGroupRows = group;
            scatterFiltered = null;

            document.getElementById('scatterMorphInfo').textContent = '形态：' + morphKey + '（共' + group.length + '场历史比赛）';
            document.getElementById('scatterLegend').style.display = 'flex';
            document.getElementById('btnScatterCoarse').style.display = '';
            document.getElementById('btnScatterFine').style.display = '';
            document.getElementById('btnScatterReset').style.display = '';

            drawScatterCharts(scatterGroupRows, scatterCurrentMatch.vals, false);
            // 正态分布：全部 + 初筛叠加
            var mv = scatterCurrentMatch.vals;
            var coarseForNorm = scatterGroupRows.filter(function(r) {
                return Math.abs(r[2] - mv.L) <= 0.2 && Math.abs(r[4] - mv.U) <= 0.1 && Math.abs(r[6] - mv.X) <= 0.2;
            });
            renderNormalDistCharts(scatterGroupRows, scatterCurrentMatch.vals, coarseForNorm);
            // Update title to show counts
            var ndTitle = document.querySelector('#normalDistWrap > div:first-child');
            if (ndTitle) ndTitle.textContent = '📈 正态分布分析（全部 ' + scatterGroupRows.length + '场，初筛 ' + coarseForNorm.length + '场叠加）';
            document.getElementById('normalDistCoarseWrap').style.display = 'none';
            renderTrendAnalysis(scatterGroupRows, scatterCurrentMatch.vals);
        }

        // 细筛条件: L±0.1, U±0.05, X±0.1; 初筛条件: 各放大一倍 L±0.2, U±0.1, X±0.2
        function scatterFilter(mode) {
            if (!scatterGroupRows || !scatterCurrentMatch) return;
            const mv = scatterCurrentMatch.vals;
            var tL, tU, tX, label;
            if (mode === 'coarse') {
                tL = 0.2; tU = 0.1; tX = 0.2; label = '初筛';
            } else {
                tL = 0.1; tU = 0.05; tX = 0.1; label = '细筛';
            }
            const filtered = scatterGroupRows.filter(function(row) {
                return Math.abs(row[2] - mv.L) <= tL &&
                       Math.abs(row[4] - mv.U) <= tU &&
                       Math.abs(row[6] - mv.X) <= tX;
            });
            scatterFiltered = mode;
            document.getElementById('scatterMorphInfo').textContent =
                '形态：' + scatterCurrentMatch.B + '|' + scatterCurrentMatch.D + '|' + scatterCurrentMatch.F +
                '（' + label + ' ' + filtered.length + '/' + scatterGroupRows.length + '场）';
            drawScatterCharts(filtered, scatterCurrentMatch.vals, mode);
        }

        function scatterReset() {
            if (!scatterGroupRows || !scatterCurrentMatch) return;
            scatterFiltered = null;
            document.getElementById('scatterMorphInfo').textContent =
                '形态：' + scatterCurrentMatch.B + '|' + scatterCurrentMatch.D + '|' + scatterCurrentMatch.F +
                '（共' + scatterGroupRows.length + '场历史比赛）';
            drawScatterCharts(scatterGroupRows, scatterCurrentMatch.vals, false);
        }

        let scatterModalIdx = 0;
        let scatterDrawRows = null;
        let scatterDrawMatch = null;

        function drawScatterCharts(rows, matchVals, filterMode) {
            scatterDrawRows = rows;
            scatterDrawMatch = matchVals;
            const wrap = document.getElementById('scatterChartsWrap');
            wrap.innerHTML = '';

            for (let ci = 0; ci < SCATTER_COLS.length; ci++) {
                const col = SCATTER_COLS[ci];
                const colLabel = SCATTER_COL_NAMES[col];

                const box = document.createElement('div');
                box.className = 'scatter-chart-box';
                box.onclick = (function(idx) { return function() { openScatterModal(idx); }; })(ci);
                const label = document.createElement('div');
                label.className = 'chart-label';
                label.textContent = col + ' ' + colLabel;
                box.appendChild(label);

                const S = 300;
                const canvas = document.createElement('canvas');
                canvas.width = S; canvas.height = S;
                box.appendChild(canvas);
                wrap.appendChild(box);

                renderScatterCanvas(canvas, ci, rows, matchVals, false);
            }

            renderLineChart(rows, matchVals, filterMode);
        }

        function renderScatterCanvas(canvas, ci, rows, matchVals, isLarge) {
            const col = SCATTER_COLS[ci];
            const ctx = canvas.getContext('2d');
            const W = canvas.width, H = canvas.height;
            ctx.clearRect(0, 0, W, H);

            const padTop = isLarge ? 30 : 22;
            const padBot = isLarge ? 20 : 12;
            const padLeft = isLarge ? 55 : 38;
            const padRight = isLarge ? 15 : 8;

            // Collect values
            const values = rows.map(r => r[ci]);
            const userVal = matchVals[col];
            const allVals = values.concat([userVal]);
            let vMin = Math.min.apply(null, allVals);
            let vMax = Math.max.apply(null, allVals);
            const pad = (vMax - vMin) * 0.1 || 0.1;
            vMin -= pad; vMax += pad;

            const plotH = H - padTop - padBot;
            const plotW = W - padLeft - padRight;

            function valToY(v) {
                return padTop + plotH - ((v - vMin) / (vMax - vMin)) * plotH;
            }

            // Background
            ctx.fillStyle = '#fafafa';
            ctx.fillRect(0, 0, W, H);
            ctx.strokeStyle = '#e0e0e0';
            ctx.strokeRect(0, 0, W, H);

            // Y-axis labels & grid
            const fontSize = isLarge ? 13 : 10;
            ctx.fillStyle = '#999';
            ctx.font = fontSize + 'px sans-serif';
            ctx.textAlign = 'right';
            const nTicks = isLarge ? 6 : 3;
            for (let i = 0; i <= nTicks; i++) {
                const lv = vMin + (vMax - vMin) * i / nTicks;
                const y = valToY(lv);
                ctx.fillText(lv.toFixed(2), padLeft - 4, y + 4);
                ctx.strokeStyle = '#eee';
                ctx.beginPath();
                ctx.moveTo(padLeft, y);
                ctx.lineTo(W - padRight, y);
                ctx.stroke();
            }

            // Sort rows: draw 上 first, then 下, then 走 last (so 走 visible on top)
            const drawOrder = [
                ...rows.map((r, i) => ({i, r})).filter(x => x.r[7] === '上'),
                ...rows.map((r, i) => ({i, r})).filter(x => x.r[7] === '下'),
                ...rows.map((r, i) => ({i, r})).filter(x => x.r[7] === '走'),
            ];

            const dotR = isLarge ? 5 : 3;
            const n = rows.length;
            for (const item of drawOrder) {
                const v = item.r[ci];
                const result = item.r[7];
                const y = valToY(v);
                // Spread dots horizontally using original index
                const x = padLeft + 8 + (plotW - 16) * ((item.i + 0.5) / Math.max(n, 1));
                ctx.beginPath();
                ctx.arc(x, y, dotR, 0, Math.PI * 2);
                ctx.fillStyle = SCATTER_RESULT_COLORS[result] || '#999';
                ctx.fill();
            }

            // Draw user dot (blue, larger, on top)
            const uy = valToY(userVal);
            const ux = padLeft + plotW / 2;
            const uR = isLarge ? 9 : 6;
            ctx.beginPath();
            ctx.arc(ux, uy, uR, 0, Math.PI * 2);
            ctx.fillStyle = '#2196f3';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = isLarge ? 3 : 2;
            ctx.stroke();
            ctx.lineWidth = 1;

            // Label for user value
            if (isLarge) {
                ctx.fillStyle = '#2196f3';
                ctx.font = 'bold 13px sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(userVal.toFixed(2), ux + uR + 4, uy + 4);
            }
        }

        function openScatterModal(idx) {
            if (!scatterDrawRows || !scatterDrawMatch) return;
            scatterModalIdx = idx;
            renderModalChart();
            document.getElementById('scatterModal').classList.add('show');
        }

        function closeScatterModal() {
            document.getElementById('scatterModal').classList.remove('show');
        }

        function scatterModalNav(dir) {
            scatterModalIdx = (scatterModalIdx + dir + SCATTER_COLS.length) % SCATTER_COLS.length;
            renderModalChart();
        }

        function renderModalChart() {
            const ci = scatterModalIdx;
            const col = SCATTER_COLS[ci];
            const colLabel = SCATTER_COL_NAMES[col];
            document.getElementById('scatterModalTitle').textContent = col + ' ' + colLabel;
            const canvas = document.getElementById('scatterModalCanvas');
            canvas.width = 600; canvas.height = 600;
            renderScatterCanvas(canvas, ci, scatterDrawRows, scatterDrawMatch, true);
        }

        // 固定纵坐标范围
        const LINE_FIXED_RANGES = {
            E: [0.5, 1.3], G: [0.5, 1.3], L: [2.4, 5.5], P: [2.4, 5.5],
            U: [-0.35, 0.25], W: [-1.6, 2.8], X: [-5, 1.7]
        };

        function renderLineChart(rows, matchVals, filterMode) {
            const wrap = document.getElementById('scatterLineChartWrap');
            const canvas = document.getElementById('scatterLineCanvas');
            if (!rows || rows.length === 0) { wrap.style.display = 'none'; return; }
            wrap.style.display = '';
            var titleLabel = '折线总览';
            if (filterMode) titleLabel += '（' + (filterMode === 'coarse' ? '初筛' : '细筛') + ' ' + rows.length + '场）';
            else titleLabel += '（全部 ' + rows.length + '场）';
            document.getElementById('lineChartTitle').textContent = titleLabel;

            const cols = SCATTER_COLS;
            const nCols = cols.length;

            // 固定纵坐标
            const mins = [], maxs = [];
            for (let ci = 0; ci < nCols; ci++) {
                const r = LINE_FIXED_RANGES[cols[ci]];
                mins.push(r[0]);
                maxs.push(r[1]);
            }

            const W = 1200, H = 500;
            canvas.width = W; canvas.height = H;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, W, H);

            const padTop = 30, padBot = 40, padLeft = 60, padRight = 30;
            const plotW = W - padLeft - padRight;
            const plotH = H - padTop - padBot;

            function colX(ci) { return padLeft + plotW * ci / (nCols - 1); }
            function normY(ci, v) {
                const t = (v - mins[ci]) / (maxs[ci] - mins[ci]);
                return padTop + plotH - t * plotH;
            }

            // Background
            ctx.fillStyle = '#fafafa';
            ctx.fillRect(0, 0, W, H);

            // Vertical axis lines and labels for each column
            ctx.textAlign = 'center';
            for (let ci = 0; ci < nCols; ci++) {
                const x = colX(ci);
                ctx.strokeStyle = '#ddd';
                ctx.beginPath();
                ctx.moveTo(x, padTop);
                ctx.lineTo(x, padTop + plotH);
                ctx.stroke();

                // Column name at bottom
                ctx.fillStyle = '#333';
                ctx.font = 'bold 13px sans-serif';
                ctx.fillText(cols[ci] + ' ' + SCATTER_COL_NAMES[cols[ci]], x, H - 10);

                // Min/max labels
                ctx.fillStyle = '#999';
                ctx.font = '11px sans-serif';
                ctx.fillText(mins[ci].toFixed(2), x, padTop + plotH + 16);
                ctx.fillText(maxs[ci].toFixed(2), x, padTop - 6);
            }

            // Draw lines: 上 first, 下 second, 走 last
            const drawOrder = [
                ...rows.filter(r => r[7] === '上'),
                ...rows.filter(r => r[7] === '下'),
                ...rows.filter(r => r[7] === '走'),
            ];

            // Clamp value to fixed range boundaries
            function clampVal(ci, v) {
                return Math.max(mins[ci], Math.min(maxs[ci], v));
            }

            ctx.lineWidth = 1;
            ctx.globalAlpha = filterMode ? 1.0 : 0.9;
            for (const row of drawOrder) {
                const color = SCATTER_RESULT_COLORS[row[7]] || '#999';
                ctx.strokeStyle = color;
                ctx.beginPath();
                for (let ci = 0; ci < nCols; ci++) {
                    const x = colX(ci);
                    const y = normY(ci, clampVal(ci, row[ci]));
                    if (ci === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            // Draw user line (blue, on top, fully opaque)
            ctx.globalAlpha = 1.0;
            ctx.strokeStyle = '#2196f3';
            ctx.lineWidth = 3;
            ctx.beginPath();
            for (let ci = 0; ci < nCols; ci++) {
                const x = colX(ci);
                const y = normY(ci, clampVal(ci, matchVals[cols[ci]]));
                if (ci === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // User dots at each column
            for (let ci = 0; ci < nCols; ci++) {
                const x = colX(ci);
                const y = normY(ci, clampVal(ci, matchVals[cols[ci]]));
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#2196f3';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            ctx.lineWidth = 1;
            ctx.globalAlpha = 1.0;
        }

        function gaussianPDF(x, mu, sigma) {
            if (sigma < 0.001) sigma = 0.001;
            var z = (x - mu) / sigma;
            return Math.exp(-0.5 * z * z) / (sigma * Math.sqrt(2 * Math.PI));
        }

        function computeNormalCurves(rows, ci, xMin, xMax, nSteps) {
            var byRes = { '上': [], '下': [], '走': [] };
            for (var i = 0; i < rows.length; i++) {
                var res = rows[i][7];
                if (byRes[res]) byRes[res].push(rows[i]);
            }
            var curves = [];
            var maxPDF = 0;
            var keys = ['上', '下', '走'];
            for (var ri = 0; ri < keys.length; ri++) {
                var rRows = byRes[keys[ri]];
                if (rRows.length < 3) { curves.push(null); continue; }
                var vals = [];
                for (var j = 0; j < rRows.length; j++) vals.push(rRows[j][ci]);
                var mean = 0;
                for (var j = 0; j < vals.length; j++) mean += vals[j];
                mean /= vals.length;
                var variance = 0;
                for (var j = 0; j < vals.length; j++) variance += (vals[j] - mean) * (vals[j] - mean);
                variance /= vals.length;
                var std = Math.sqrt(variance);
                var points = [];
                for (var s = 0; s <= nSteps; s++) {
                    var xv = xMin + (xMax - xMin) * s / nSteps;
                    var pdf = gaussianPDF(xv, mean, std);
                    points.push({ x: xv, y: pdf });
                    if (pdf > maxPDF) maxPDF = pdf;
                }
                curves.push({ points: points, mean: mean, std: std, count: rRows.length });
            }
            return { curves: curves, maxPDF: maxPDF };
        }

        var normDistResultCfg = [
            { key: '上', color: 'rgba(229,57,53,0.9)' },
            { key: '下', color: 'rgba(76,175,80,0.9)' },
            { key: '走', color: 'rgba(255,152,0,0.9)' }
        ];
        var normDistCoarseCfg = [
            { key: '上', color: 'rgba(229,57,53,0.5)' },
            { key: '下', color: 'rgba(76,175,80,0.5)' },
            { key: '走', color: 'rgba(255,152,0,0.5)' }
        ];

        // Store data for modal re-render
        var normDistAllRows = null;
        var normDistCoarseRows = null;
        var normDistMatchVals = null;
        var normDistModalIdx = 0;

        function renderOneNormDist(canvas, ci, allRows, coarseRows, matchVals, isLarge) {
            var col = SCATTER_COLS[ci];
            var range = LINE_FIXED_RANGES[col];
            var xMin = range[0], xMax = range[1];
            var userVal = matchVals[col];
            var nSteps = 200;

            var W = canvas.width, H = canvas.height;
            var ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, W, H);

            var padTop = isLarge ? 30 : 20;
            var padBot = isLarge ? 44 : 36;
            var padLeft = isLarge ? 15 : 10;
            var padRight = isLarge ? 15 : 10;
            var plotW = W - padLeft - padRight;
            var plotH = H - padTop - padBot;

            ctx.fillStyle = '#fafafa';
            ctx.fillRect(0, 0, W, H);
            ctx.strokeStyle = '#e0e0e0';
            ctx.strokeRect(0, 0, W, H);

            var fullData = computeNormalCurves(allRows, ci, xMin, xMax, nSteps);
            var globalMaxPDF = fullData.maxPDF;
            if (globalMaxPDF < 0.001) globalMaxPDF = 1;

            var coarseData = null;
            if (coarseRows && coarseRows.length >= 3) {
                coarseData = computeNormalCurves(coarseRows, ci, xMin, xMax, nSteps);
            }

            function valToX(v) { return padLeft + (v - xMin) / (xMax - xMin) * plotW; }
            function pdfToY(pdf) { return padTop + plotH - (pdf / globalMaxPDF) * plotH; }
            function pdfToYHalf(pdf) { return padTop + plotH - (pdf / globalMaxPDF) * plotH * 0.5; }

            // X axis
            ctx.strokeStyle = '#ccc';
            ctx.beginPath();
            ctx.moveTo(padLeft, padTop + plotH);
            ctx.lineTo(padLeft + plotW, padTop + plotH);
            ctx.stroke();

            var fontSize = isLarge ? 13 : 10;
            ctx.fillStyle = '#999';
            ctx.font = fontSize + 'px sans-serif';
            ctx.textAlign = 'center';
            var nTicks = isLarge ? 8 : 5;
            for (var t = 0; t <= nTicks; t++) {
                var tv = xMin + (xMax - xMin) * t / nTicks;
                var tx = valToX(tv);
                ctx.fillText(tv.toFixed(2), tx, H - (isLarge ? 12 : 8));
                ctx.strokeStyle = '#eee';
                ctx.beginPath();
                ctx.moveTo(tx, padTop);
                ctx.lineTo(tx, padTop + plotH);
                ctx.stroke();
            }

            // Full curves (solid)
            var lineW = isLarge ? 3 : 2;
            for (var ri = 0; ri < normDistResultCfg.length; ri++) {
                if (!fullData.curves[ri]) continue;
                var pts = fullData.curves[ri].points;
                ctx.beginPath();
                for (var s = 0; s < pts.length; s++) {
                    var px = valToX(pts[s].x);
                    var py = pdfToY(pts[s].y);
                    if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.strokeStyle = normDistResultCfg[ri].color;
                ctx.lineWidth = lineW;
                ctx.stroke();
                ctx.lineWidth = 1;
            }

            // Coarse curves (dashed, half height)
            if (coarseData) {
                ctx.setLineDash([isLarge ? 6 : 4, isLarge ? 4 : 3]);
                for (var ri = 0; ri < normDistCoarseCfg.length; ri++) {
                    if (!coarseData.curves[ri]) continue;
                    var pts = coarseData.curves[ri].points;
                    ctx.beginPath();
                    for (var s = 0; s < pts.length; s++) {
                        var px = valToX(pts[s].x);
                        var py = pdfToYHalf(pts[s].y);
                        if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                    }
                    ctx.strokeStyle = normDistCoarseCfg[ri].color;
                    ctx.lineWidth = lineW;
                    ctx.stroke();
                    ctx.lineWidth = 1;
                }
                ctx.setLineDash([]);
            }

            // User value line
            var ux = valToX(Math.max(xMin, Math.min(xMax, userVal)));
            ctx.strokeStyle = '#000';
            ctx.lineWidth = isLarge ? 3 : 2;
            ctx.setLineDash([6, 3]);
            ctx.beginPath();
            ctx.moveTo(ux, padTop);
            ctx.lineTo(ux, padTop + plotH);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.lineWidth = 1;

            ctx.fillStyle = '#000';
            ctx.font = 'bold ' + (isLarge ? 14 : 11) + 'px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(userVal.toFixed(2), ux, padTop - (isLarge ? 8 : 5));

            // Legend
            var legFont = isLarge ? 13 : 10;
            ctx.font = legFont + 'px sans-serif';
            ctx.textAlign = 'right';
            var ly = padTop + (isLarge ? 16 : 12);
            for (var ri = 0; ri < normDistResultCfg.length; ri++) {
                if (!fullData.curves[ri]) continue;
                var txt = normDistResultCfg[ri].key + ' ' + fullData.curves[ri].count;
                if (coarseData && coarseData.curves[ri]) txt += '/' + coarseData.curves[ri].count;
                txt += '场';
                ctx.fillStyle = normDistResultCfg[ri].color;
                ctx.fillText(txt, W - padRight - 4, ly);
                ly += (isLarge ? 18 : 14);
            }
            if (coarseData) {
                ctx.fillStyle = '#999';
                ctx.font = (isLarge ? 11 : 9) + 'px sans-serif';
                ctx.fillText('实线=全部 虚线=初筛', W - padRight - 4, ly);
            }
        }

        function renderNormalDistCharts(allRows, matchVals, coarseRows) {
            var wrap = document.getElementById('normalDistWrap');
            var grid = document.getElementById('normalDistGrid');
            if (!allRows || allRows.length < 10) { wrap.style.display = 'none'; return; }
            wrap.style.display = '';
            grid.innerHTML = '';

            normDistAllRows = allRows;
            normDistCoarseRows = coarseRows;
            normDistMatchVals = matchVals;

            for (var ci = 0; ci < SCATTER_COLS.length; ci++) {
                var col = SCATTER_COLS[ci];
                var box = document.createElement('div');
                box.className = 'normal-dist-box';
                box.style.cursor = 'pointer';
                box.onclick = (function(idx) { return function() { openNormDistModal(idx); }; })(ci);
                var label = document.createElement('div');
                label.className = 'chart-label';
                label.textContent = col + ' ' + SCATTER_COL_NAMES[col];
                box.appendChild(label);

                var canvas = document.createElement('canvas');
                canvas.width = 400;
                canvas.height = 280;
                box.appendChild(canvas);
                grid.appendChild(box);

                renderOneNormDist(canvas, ci, allRows, coarseRows, matchVals, false);
            }
        }

        function openNormDistModal(idx) {
            if (!normDistAllRows || !normDistMatchVals) return;
            normDistModalIdx = idx;
            renderNormDistModalChart();
            document.getElementById('normDistModal').classList.add('show');
        }
        function closeNormDistModal() {
            document.getElementById('normDistModal').classList.remove('show');
        }
        function normDistModalNav(dir) {
            normDistModalIdx = (normDistModalIdx + dir + SCATTER_COLS.length) % SCATTER_COLS.length;
            renderNormDistModalChart();
        }
        function renderNormDistModalChart() {
            var ci = normDistModalIdx;
            var col = SCATTER_COLS[ci];
            document.getElementById('normDistModalTitle').textContent = col + ' ' + SCATTER_COL_NAMES[col];
            var canvas = document.getElementById('normDistModalCanvas');
            canvas.width = 800; canvas.height = 560;
            renderOneNormDist(canvas, ci, normDistAllRows, normDistCoarseRows, normDistMatchVals, true);
        }

        function renderTrendAnalysis(allRows, matchVals) {
            var wrap = document.getElementById('trendAnalysisWrap');
            var panel = document.getElementById('trendPanel');
            if (!allRows || allRows.length < 10) { wrap.style.display = 'none'; return; }
            wrap.style.display = '';

            var mv = matchVals;
            // Three levels
            var coarse = allRows.filter(function(r) {
                return Math.abs(r[2] - mv.L) <= 0.2 && Math.abs(r[4] - mv.U) <= 0.1 && Math.abs(r[6] - mv.X) <= 0.2;
            });
            var fine = allRows.filter(function(r) {
                return Math.abs(r[2] - mv.L) <= 0.1 && Math.abs(r[4] - mv.U) <= 0.05 && Math.abs(r[6] - mv.X) <= 0.1;
            });

            function countResults(rows) {
                var up = 0, dn = 0, zou = 0;
                for (var i = 0; i < rows.length; i++) {
                    if (rows[i][7] === '上') up++;
                    else if (rows[i][7] === '下') dn++;
                    else zou++;
                }
                return { up: up, dn: dn, zou: zou, total: rows.length };
            }

            var levels = [
                { name: '全部', rows: allRows, c: countResults(allRows) },
                { name: '初筛', rows: coarse, c: countResults(coarse) },
                { name: '细筛', rows: fine, c: countResults(fine) }
            ];

            // Build table
            var html = '<table class="trend-table"><thead><tr>';
            html += '<th>层级</th><th>场次</th><th>上盘</th><th>下盘</th><th>走盘</th><th>上盘占比</th><th>比例条</th><th>漂移</th>';
            html += '</tr></thead><tbody>';

            var prevRatio = null;
            var ratios = [];
            for (var i = 0; i < levels.length; i++) {
                var lv = levels[i];
                var c = lv.c;
                var updn = c.up + c.dn;
                var ratio = updn > 0 ? c.up / updn : 0.5;
                ratios.push(ratio);
                var pctUp = (ratio * 100).toFixed(1);
                var pctDn = ((1 - ratio) * 100).toFixed(1);

                // Drift arrow
                var drift = '';
                if (prevRatio !== null && updn >= 3) {
                    var diff = ratio - prevRatio;
                    if (diff > 0.02) drift = '<span class="trend-drift up">↑+' + (diff * 100).toFixed(1) + '%</span>';
                    else if (diff < -0.02) drift = '<span class="trend-drift dn">↓' + (diff * 100).toFixed(1) + '%</span>';
                    else drift = '<span class="trend-drift flat">→持平</span>';
                }

                // Bar
                var barW_up = c.total > 0 ? (c.up / c.total * 100) : 0;
                var barW_dn = c.total > 0 ? (c.dn / c.total * 100) : 0;
                var barW_zou = c.total > 0 ? (c.zou / c.total * 100) : 0;
                var bar = '<div class="trend-bar-wrap">' +
                    '<div class="trend-bar-up" style="width:' + barW_up + '%"></div>' +
                    '<div class="trend-bar-dn" style="width:' + barW_dn + '%"></div>' +
                    '<div class="trend-bar-zou" style="width:' + barW_zou + '%"></div>' +
                    '</div>';

                html += '<tr>';
                html += '<td class="level-label">' + lv.name + '</td>';
                html += '<td>' + c.total + '</td>';
                html += '<td style="color:#e53935;font-weight:600">' + c.up + '</td>';
                html += '<td style="color:#4caf50;font-weight:600">' + c.dn + '</td>';
                html += '<td style="color:#ff9800;font-weight:600">' + c.zou + '</td>';
                html += '<td><strong>' + pctUp + '%</strong></td>';
                html += '<td>' + bar + '</td>';
                html += '<td>' + drift + '</td>';
                html += '</tr>';

                if (updn >= 3) prevRatio = ratio;
            }
            html += '</tbody></table>';

            // Conclusion
            var allRatio = ratios[0];
            var coarseRatio = levels[1].c.up + levels[1].c.dn >= 3 ? ratios[1] : null;
            var fineRatio = levels[2].c.up + levels[2].c.dn >= 3 ? ratios[2] : null;

            // Determine direction and confidence
            var direction = '';  // '上' or '下'
            var confidence = '';  // 'strong', 'moderate', 'weak'
            var reason = '';

            // Check consistency of direction across levels
            var dirs = [];
            if (allRatio > 0.5) dirs.push('上'); else if (allRatio < 0.5) dirs.push('下'); else dirs.push('平');
            if (coarseRatio !== null) {
                if (coarseRatio > 0.5) dirs.push('上'); else if (coarseRatio < 0.5) dirs.push('下'); else dirs.push('平');
            }
            if (fineRatio !== null) {
                if (fineRatio > 0.5) dirs.push('上'); else if (fineRatio < 0.5) dirs.push('下'); else dirs.push('平');
            }

            var allSame = dirs.every(function(d) { return d === dirs[0]; });
            var mainDir = dirs[dirs.length - 1]; // use finest available level

            // Check drift trend
            var drifts = [];
            if (coarseRatio !== null) drifts.push(coarseRatio - allRatio);
            if (fineRatio !== null && coarseRatio !== null) drifts.push(fineRatio - coarseRatio);
            var consistentDrift = drifts.length >= 2 && ((drifts[0] > 0 && drifts[1] > 0) || (drifts[0] < 0 && drifts[1] < 0));
            var driftDir = drifts.length > 0 ? (drifts[drifts.length - 1] > 0 ? '上' : '下') : '';

            if (allSame && dirs[0] !== '平') {
                direction = dirs[0];
                if (consistentDrift && driftDir === direction) {
                    confidence = 'strong';
                    reason = '三级方向一致（' + direction + '），且漂移持续增强';
                } else {
                    confidence = 'moderate';
                    reason = '三级方向一致（' + direction + '），但漂移不连续';
                }
            } else if (dirs.length >= 2) {
                // Not all same
                if (fineRatio !== null && Math.abs(fineRatio - 0.5) > Math.abs(allRatio - 0.5)) {
                    direction = fineRatio > 0.5 ? '上' : '下';
                    confidence = 'weak';
                    reason = '各级方向不一致，细筛偏向' + direction + '但信号较弱';
                } else {
                    direction = allRatio > 0.5 ? '上' : '下';
                    confidence = 'weak';
                    reason = '各级方向不一致，全局偏向' + direction + '但筛选后减弱';
                }
            } else {
                direction = allRatio >= 0.5 ? '上' : '下';
                confidence = 'weak';
                reason = '数据不足以进行多级分析';
            }

            var confLabel = confidence === 'strong' ? '🟢 强信号' : confidence === 'moderate' ? '🟡 中等信号' : '🔴 弱信号';
            var dirColor = direction === '上' ? '#e53935' : '#4caf50';

            html += '<div class="trend-conclusion ' + confidence + '">';
            html += '<strong>' + confLabel + '</strong> &nbsp; ';
            html += '趋势方向：<span style="color:' + dirColor + ';font-weight:700;font-size:16px;">' + direction + '盘</span><br>';
            html += '<span style="color:#666;font-size:13px;">' + reason + '</span>';
            html += '</div>';

            panel.innerHTML = html;
        }

        // Close modal on overlay click
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('scatterModal').addEventListener('click', function(e) {
                if (e.target === this) closeScatterModal();
            });
            document.getElementById('normDistModal').addEventListener('click', function(e) {
                if (e.target === this) closeNormDistModal();
            });
            document.addEventListener('keydown', function(e) {
                var scatterM = document.getElementById('scatterModal');
                var normM = document.getElementById('normDistModal');
                if (normM.classList.contains('show')) {
                    if (e.key === 'Escape') closeNormDistModal();
                    if (e.key === 'ArrowLeft') normDistModalNav(-1);
                    if (e.key === 'ArrowRight') normDistModalNav(1);
                    return;
                }
                if (scatterM.classList.contains('show')) {
                    if (e.key === 'Escape') closeScatterModal();
                    if (e.key === 'ArrowLeft') scatterModalNav(-1);
                    if (e.key === 'ArrowRight') scatterModalNav(1);
                }
            });
        });
    </script>
</body>
</html>
