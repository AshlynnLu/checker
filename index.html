<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 手工形态汇总匹配工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #1976d2;
        }
        
        .loading-status {
            text-align: center;
            padding: 10px;
            color: #666;
            font-size: 14px;
        }
        
        .input-section {
            margin-bottom: 30px;
        }
        
        .paste-section {
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 2px dashed #667eea;
        }
        
        .paste-section label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }
        
        .paste-section textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            min-height: 80px;
            transition: all 0.3s;
        }
        
        .paste-section textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .paste-section .paste-hint {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            font-style: italic;
        }
        
        .btn-parse {
            background: #4caf50;
            color: white;
        }
        
        .btn-parse:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }
        
        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
        }
        
        .input-group label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
            font-weight: 500;
        }
        
        .input-group input {
            padding: 8px 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .input-group.required label::after {
            content: ' *';
            color: #e74c3c;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }
        
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-check {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-check:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-check:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-clear {
            background: #e0e0e0;
            color: #333;
        }
        
        .btn-clear:hover {
            background: #d0d0d0;
        }
        
        .result-section {
            margin-top: 30px;
            display: none;
        }
        
        .result-section.show {
            display: block;
        }
        
        .result-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        
        .result-card.matched {
            background: #e8f5e9;
            border-left-color: #4caf50;
        }
        
        .result-card.not-matched {
            background: #ffebee;
            border-left-color: #f44336;
        }
        
        .result-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }
        
        .result-status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .status-matched {
            background: #4caf50;
            color: white;
        }
        
        .status-not-matched {
            background: #f44336;
            color: white;
        }
        
        .rules-list {
            margin-top: 15px;
        }
        
        .rule-item {
            background: white;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 13px;
            border: 1px solid #e0e0e0;
        }
        
        .rule-item.pred-shang {
            border-left: 4px solid #4caf50;
        }
        
        .rule-item.pred-xia {
            border-left: 4px solid #ff9800;
        }
        
        .rule-item strong {
            color: #667eea;
        }
        
        .prediction-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
        }
        
        .prediction-badge.shang {
            background: #4caf50;
            color: white;
        }
        
        .prediction-badge.xia {
            background: #ff9800;
            color: white;
        }
        
        .prediction-badge.zou {
            background: #9e9e9e;
            color: white;
        }
        
        .rules-group {
            margin-top: 15px;
        }
        
        .rules-group-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Scatter plot section */
        .scatter-section {
            margin-top: 30px;
        }

        .scatter-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #667eea;
        }

        .scatter-input-area {
            margin-bottom: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 2px dashed #667eea;
        }

        .scatter-input-area label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .scatter-input-area textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            min-height: 60px;
            transition: all 0.3s;
        }

        .scatter-input-area textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .scatter-btn-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .scatter-btn-row button {
            padding: 10px 24px;
            font-size: 14px;
        }

        .btn-scatter-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-scatter-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-scatter-filter {
            background: #ff9800;
            color: white;
        }

        .btn-scatter-filter:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.4);
        }

        .btn-scatter-reset {
            background: #e0e0e0;
            color: #333;
        }

        .btn-scatter-reset:hover {
            background: #d0d0d0;
        }

        .scatter-morph-info {
            margin-left: 15px;
            font-size: 13px;
            color: #666;
        }

        .scatter-legend {
            display: flex;
            gap: 18px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            font-size: 13px;
            align-items: center;
        }

        .scatter-legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .scatter-legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .scatter-charts-wrap {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        @media (max-width: 900px) {
            .scatter-charts-wrap { grid-template-columns: repeat(3, 1fr); }
        }

        .scatter-chart-box {
            text-align: center;
            cursor: pointer;
        }
        .scatter-chart-box canvas {
            width: 100% !important;
            height: auto !important;
            aspect-ratio: 1;
        }

        .scatter-chart-box .chart-label {
            font-size: 12px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        /* Scatter modal */
        .scatter-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .scatter-modal-overlay.show { display: flex; }
        .scatter-modal {
            position: relative;
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            max-width: 90vw;
            max-height: 90vh;
            text-align: center;
        }
        .scatter-modal .modal-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .scatter-modal canvas {
            max-width: 80vmin;
            max-height: 80vmin;
        }
        .scatter-modal-close {
            position: absolute;
            top: 8px; right: 14px;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            background: none; border: none;
        }
        .scatter-modal-close:hover { color: #333; }
        .scatter-modal-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 36px;
            cursor: pointer;
            color: #667eea;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 50%;
            width: 48px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .scatter-modal-arrow:hover { background: #667eea; color: #fff; }
        .scatter-modal-arrow.left { left: -60px; }
        .scatter-modal-arrow.right { right: -60px; }

        .normal-dist-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        @media (max-width: 900px) {
            .normal-dist-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .normal-dist-box {
            text-align: center;
        }
        .normal-dist-box canvas {
            width: 100% !important;
            height: auto !important;
        }
        .normal-dist-box .chart-label {
            font-size: 12px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>2026 手工形态汇总匹配工具</h1>
        <p class="subtitle">输入指定列数据，匹配「2026 手工形态汇总类型库（已人工验证）」</p>
        
        <div class="info-box">
            <strong>说明：</strong>
            <ul style="margin: 10px 0 0 20px;">
                <li>先按主/客 + 盘口组合（B/D/F）匹配到汇总分组，再按每行条件逐条比对</li>
                <li>命中后展示：预测、上/走/下、标注、提示</li>
            </ul>
            <div style="margin-top:10px;text-align:right;">
                <a href="manage.html" style="color:#1976d2;font-weight:600;text-decoration:none;">规则管理 →</a>
            </div>
        </div>
        
        <div class="loading-status" id="loadingStatus">正在加载 2026 汇总类型库...</div>
        
        <div class="input-section" id="inputSection" style="display: none;">
            <div class="paste-section">
                <label for="pasteData">快速粘贴（按列顺序：A B C D E F G H I K L M O P Q U V W X Y，用制表符或空格分隔）：</label>
                <textarea id="pasteData" placeholder="例如：英超	客	4	0	0.8	0	0.78	0	0.02	2.4	3.1	2.7	2.39	2.9	2.74	-0.01	-0.20	0.04	0.15"></textarea>
                <p class="paste-hint">💡 提示：从Excel或表格中复制整行数据，然后粘贴到上方文本框，点击"解析数据"按钮即可自动填充</p>
                <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:10px;">
                    <button class="btn-parse" onclick="parsePastedData()" style="min-width:120px; height:40px; font-size:14px;">解析数据</button>
                    <button class="btn-clear" onclick="clearData()" style="min-width:120px; height:40px; font-size:14px;">清空</button>
                </div>
                <div style="text-align:right; margin-top:6px;">
                    <a href="javascript:void(0)" onclick="toggleInputFields()" id="toggleFieldsLink" style="font-size:12px; color:#888; text-decoration:none;">展开输入框 ▼</a>
                </div>
            </div>

            <div class="input-grid" id="inputFieldsGrid" style="display:none;">
                <div class="input-group">
                    <label>A (强队)</label>
                    <input type="text" id="A" placeholder="强队">
                </div>
                <div class="input-group required">
                    <label>B (弱队/主客)</label>
                    <input type="text" id="B" placeholder="主/客" required>
                </div>
                <div class="input-group">
                    <label>C (时间)</label>
                    <input type="text" id="C" placeholder="时间">
                </div>
                <div class="input-group required">
                    <label>D (澳门)</label>
                    <input type="text" id="D" placeholder="0" required>
                </div>
                <div class="input-group">
                    <label>E (上水)</label>
                    <input type="text" id="E" placeholder="数值">
                </div>
                <div class="input-group required">
                    <label>F (马会)</label>
                    <input type="text" id="F" placeholder="0" required>
                </div>
                <div class="input-group">
                    <label>G (上水)</label>
                    <input type="text" id="G" placeholder="数值">
                </div>
                <div class="input-group">
                    <label>H (盘差)</label>
                    <input type="text" id="H" placeholder="数值">
                </div>
                <div class="input-group">
                    <label>I (水差)</label>
                    <input type="text" id="I" placeholder="数值">
                </div>
                <div class="input-group">
                    <label>K</label>
                    <input type="text" id="K" placeholder="数值">
                </div>
                <div class="input-group">
                    <label>L（澳）</label>
                    <input type="text" id="L" placeholder="数值">
                </div>
                <div class="input-group">
                    <label>M (马)</label>
                    <input type="text" id="M" placeholder="数值">
                </div>
                <div class="input-group">
                    <label>O</label>
                    <input type="text" id="O" placeholder="数值">
                </div>
                <div class="input-group">
                    <label>P（马）</label>
                    <input type="text" id="P" placeholder="数值">
                </div>
                <div class="input-group">
                    <label>Q</label>
                    <input type="text" id="Q" placeholder="数值">
                </div>
                <div class="input-group">
                    <label>U（主差）</label>
                    <input type="text" id="U" placeholder="数值">
                </div>
                <div class="input-group">
                    <label>V（平差）</label>
                    <input type="text" id="V" placeholder="数值">
                </div>
                <div class="input-group">
                    <label>W（客差）</label>
                    <input type="text" id="W" placeholder="数值">
                </div>
                <div class="input-group">
                    <label>X（澳平客差）</label>
                    <input type="text" id="X" placeholder="数值">
                </div>
                <div class="input-group">
                    <label>Y（马平客差）</label>
                    <input type="text" id="Y" placeholder="数值">
                </div>
            </div>
            
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>正在分析...</div>
        </div>
        
        <div class="result-section" id="resultSection">
            <div class="result-card" id="summaryResult">
                <div class="result-title">2026 手工形态汇总类型库（已人工验证）</div>
                <div class="result-status" id="summaryStatus"></div>
                <div class="rules-list" id="summaryRules"></div>
            </div>
        </div>

        <!-- Scatter plot section -->
        <div class="scatter-section" id="scatterSection">
            <div class="scatter-title">散点图分析</div>
            <div class="scatter-input-area">
                <div class="scatter-btn-row">
                    <button class="btn-scatter-add" onclick="scatterAdd()">添加比赛（使用上方数据）</button>
                    <button class="btn-scatter-filter" onclick="scatterFilter('coarse')" id="btnScatterCoarse" style="display:none;">初筛</button>
                    <button class="btn-scatter-filter" onclick="scatterFilter('fine')" id="btnScatterFine" style="display:none;">细筛</button>
                    <button class="btn-scatter-filter" onclick="showSlopeSummary()" id="btnSlopeSummary" style="display:none;">斜率统计</button>
                    <button class="btn-scatter-reset" onclick="scatterReset()" id="btnScatterReset" style="display:none;">重置</button>
                    <span class="scatter-morph-info" id="scatterMorphInfo"></span>
                </div>
            </div>
            <div class="scatter-legend" id="scatterLegend" style="display:none;">
                <span class="scatter-legend-item"><span class="scatter-legend-dot" style="background:#e53935;"></span> 上</span>
                <span class="scatter-legend-item"><span class="scatter-legend-dot" style="background:#4caf50;"></span> 下</span>
                <span class="scatter-legend-item"><span class="scatter-legend-dot" style="background:#ff9800;"></span> 走</span>
                <span class="scatter-legend-item"><span class="scatter-legend-dot" style="background:#2196f3;width:14px;height:14px;"></span> 未赛（当前输入）</span>
            </div>
            <div class="scatter-charts-wrap" id="scatterChartsWrap"></div>
            <div id="slopeSummaryWrap" style="display:none; margin-top:10px;"></div>
            <!-- 集中度统计表 -->
            <div id="normalDistWrap" style="display:none; margin-top:18px;">
                <div id="normalDistTitle" style="font-weight:700; font-size:15px; margin-bottom:10px; color:#333;">📊 集中度统计</div>
                <div id="normalDistGrid"></div>
            </div>
            <div id="slopeToggleWrap" style="display:none; margin-top:18px;">
                <a href="javascript:void(0)" onclick="toggleSlopeTable()" id="slopeToggleLink" style="font-size:12px; color:#666; text-decoration:none;">展开斜率详情 ▼</a>
                <div id="slopeTableWrap" style="display:none; margin-top:8px;"></div>
            </div>
        </div>
    </div>

    <!-- Scatter modal -->
    <div class="scatter-modal-overlay" id="scatterModal">
        <div class="scatter-modal">
            <button class="scatter-modal-close" onclick="closeScatterModal()">&times;</button>
            <button class="scatter-modal-arrow left" onclick="scatterModalNav(-1)">&#8249;</button>
            <button class="scatter-modal-arrow right" onclick="scatterModalNav(1)">&#8250;</button>
            <div class="modal-title" id="scatterModalTitle"></div>
            <canvas id="scatterModalCanvas" width="600" height="600"></canvas>
        </div>
    </div>

        <script>
        let summaryTypesData = null;
        
        // 加载 2026 手工形态汇总类型库
        async function loadSummaryTypes() {
            try {
                const response = await fetch('static/summary_types_v2.json');
                if (!response.ok) {
                    throw new Error('无法加载汇总类型库（static/summary_types_v2.json）');
                }
                summaryTypesData = await response.json();
                const meta = summaryTypesData.meta || {};
                document.getElementById('loadingStatus').textContent = `2026 汇总类型库已加载（共 ${meta.total_types || 0} 条）`;
                document.getElementById('inputSection').style.display = 'block';
            } catch (error) {
                document.getElementById('loadingStatus').textContent = '2026 汇总类型库加载失败：' + error.message;
                document.getElementById('loadingStatus').style.color = '#f44336';
            }
        }
        
        async function checkData() {
            if (!summaryTypesData) {
                alert('汇总类型库尚未加载，请稍候...');
                return;
            }
            
            // 收集数据
            const data = {};
            const columns = ['A','B','C','D','E','F','G','H','I','K','L','M','O','P','Q','U','V','W','X','Y'];
            for (let col of columns) {
                const input = document.getElementById(col);
                const val = input.value.trim();
                data[col] = val || null;
            }

        // 使用 2026 汇总类型库判断当前行是否命中人工验证类型
        function checkSummaryTypes(rowData) {
            const matched = [];
            if (!summaryTypesData || !summaryTypesData.types) {
                return matched;
            }

            const B = String(rowData.B || '').trim();
            const D = String(rowData.D || '').trim();
            const F = String(rowData.F || '').trim();

            if (B !== '主' && B !== '客') return matched;

            const morph = [B, D, F];

            function getNum(col) {
                const val = rowData[col];
                if (val === null || val === undefined || val === '') return null;
                const num = parseFloat(val);
                return isNaN(num) ? null : num;
            }

            const vals = {
                G: getNum('G'), // 汇总:马会 -> 输入G(上水)
                I: getNum('I'), // 汇总:水差 -> 输入I
                L: getNum('L'), // 汇总:澳平 -> 输入L(澳)
                O: getNum('O'), // 汇总:马主 -> 输入O
                P: getNum('P'), // 汇总:马平 -> 输入P(马)
                U: getNum('U'), // 汇总:主差 -> 输入U
                V: getNum('V'), // 汇总:平差 -> 输入V
                W: getNum('W'), // 汇总:客差 -> 输入W
                X: getNum('X')  // 汇总:澳平客差 -> 输入X
            };

            const EPS = 1e-9;
            for (const t of summaryTypesData.types) {
                const tm = t.morph || [];
                if (tm.length !== 3) continue;
                if (tm[0] !== morph[0] || tm[1] !== morph[1] || tm[2] !== morph[2]) {
                    continue;
                }

                const conds = t.conditions || {};
                let ok = true;
                outer: for (const [colName, condList] of Object.entries(conds)) {
                    const v = vals[colName];
                    if (v === null || v === undefined) {
                        ok = false;
                        break;
                    }
                    for (const c of condList) {
                        const op = c.op;
                        const val = c.value;
                        if (op === '>=') {
                            if (!(v >= val)) { ok = false; break outer; }
                        } else if (op === '<=') {
                            if (!(v <= val)) { ok = false; break outer; }
                        } else if (op === '>') {
                            if (!(v > val)) { ok = false; break outer; }
                        } else if (op === '<') {
                            if (!(v < val)) { ok = false; break outer; }
                        } else if (op === '=') {
                            if (!(Math.abs(v - val) <= EPS)) { ok = false; break outer; }
                        }
                    }
                }

            if (ok) {
                matched.push(t);
            }
        }

        return matched;
    }

        function renderScatterCanvas(canvas, ci, rows, matchVals, isLarge) {
            const col = SCATTER_COLS[ci];
            const ctx = canvas.getContext('2d');
            const W = canvas.width, H = canvas.height;
            ctx.clearRect(0, 0, W, H);

            const padTop = isLarge ? 30 : 22;
            const padBot = isLarge ? 20 : 12;
            const padLeft = isLarge ? 55 : 38;
            const padRight = isLarge ? 15 : 8;

            // Collect values
            const values = rows.map(r => r[ci]);
            const userVal = matchVals[col];
            const allVals = values.concat([userVal]);
            let vMin = Math.min.apply(null, allVals);
            let vMax = Math.max.apply(null, allVals);
            const pad = (vMax - vMin) * 0.1 || 0.1;
            vMin -= pad; vMax += pad;

            const plotH = H - padTop - padBot;
            const plotW = W - padLeft - padRight;

            function valToY(v) {
                return padTop + plotH - ((v - vMin) / (vMax - vMin)) * plotH;
            }

            // Background
            ctx.fillStyle = '#fafafa';
            ctx.fillRect(0, 0, W, H);
            ctx.strokeStyle = '#e0e0e0';
            ctx.strokeRect(0, 0, W, H);

            // Y-axis labels & grid
            const fontSize = isLarge ? 13 : 10;
            ctx.fillStyle = '#999';
            ctx.font = fontSize + 'px sans-serif';
            ctx.textAlign = 'right';
            const nTicks = isLarge ? 6 : 3;
            for (let i = 0; i <= nTicks; i++) {
                const lv = vMin + (vMax - vMin) * i / nTicks;
                const y = valToY(lv);
                ctx.fillText(lv.toFixed(2), padLeft - 4, y + 4);
                ctx.strokeStyle = '#eee';
                ctx.beginPath();
                ctx.moveTo(padLeft, y);
                ctx.lineTo(W - padRight, y);
                ctx.stroke();
            }

            // Sort rows: draw 上 first, then 下, then 走 last (so 走 visible on top)
            const drawOrder = [
                ...rows.map((r, i) => ({i, r})).filter(x => x.r[RESULT_IDX] === '上'),
                ...rows.map((r, i) => ({i, r})).filter(x => x.r[RESULT_IDX] === '下'),
                ...rows.map((r, i) => ({i, r})).filter(x => x.r[RESULT_IDX] === '走'),
            ];

            const dotR = isLarge ? 5 : 3;
            const n = rows.length;
            for (const item of drawOrder) {
                const v = item.r[ci];
                const result = item.r[RESULT_IDX];
                const y = valToY(v);
                // Spread dots horizontally using original index
                const x = padLeft + 8 + (plotW - 16) * ((item.i + 0.5) / Math.max(n, 1));
                ctx.beginPath();
                ctx.arc(x, y, dotR, 0, Math.PI * 2);
                ctx.fillStyle = SCATTER_RESULT_COLORS[result] || '#999';
                ctx.fill();
            }

            // Draw user dot (blue, larger, on top)
            const uy = valToY(userVal);
            const ux = padLeft + plotW / 2;
            const uR = isLarge ? 9 : 6;
            ctx.beginPath();
            ctx.arc(ux, uy, uR, 0, Math.PI * 2);
            ctx.fillStyle = '#2196f3';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = isLarge ? 3 : 2;
            ctx.stroke();
            ctx.lineWidth = 1;

            // Label for user value
            if (isLarge) {
                ctx.fillStyle = '#2196f3';
                ctx.font = 'bold 13px sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(userVal.toFixed(2), ux + uR + 4, uy + 4);
            }
        }

        function toggleSlopeTable() {
            var wrap = document.getElementById('slopeTableWrap');
            var link = document.getElementById('slopeToggleLink');
            if (wrap.style.display === 'none') {
                wrap.style.display = '';
                link.textContent = '收起斜率详情 ▲';
            } else {
                wrap.style.display = 'none';
                link.textContent = '展开斜率详情 ▼';
            }
        }

        function renderSlopeTable(rows, matchVals) {
            var toggleWrap = document.getElementById('slopeToggleWrap');
            const wrap = document.getElementById('slopeTableWrap');
            if (!rows || rows.length === 0) { toggleWrap.style.display = 'none'; return; }
            toggleWrap.style.display = '';

            const cols = SCATTER_COLS;
            // 计算当前比赛的斜率
            const userSlopes = SLOPE_PAIRS.map(function(sp) {
                return matchVals[cols[sp.b]] - matchVals[cols[sp.a]];
            });

            // 计算每场比赛的斜率和与用户斜率的欧氏距离
            const rowData = [];
            for (let i = 0; i < rows.length; i++) {
                const slopes = SLOPE_PAIRS.map(function(sp) {
                    return rows[i][sp.b] - rows[i][sp.a];
                });
                let distSq = 0;
                const dists = [];
                for (let s = 0; s < slopes.length; s++) {
                    var d = Math.abs(slopes[s] - userSlopes[s]);
                    dists.push(d);
                    distSq += d * d;
                }
                rowData.push({ idx: i, slopes: slopes, dists: dists, dist: Math.sqrt(distSq), result: rows[i][RESULT_IDX] });
            }

            rowData.sort(function(a, b) { return a.dist - b.dist; });

            // 找出每列距离的最小值和最大值
            var nDistCols = SLOPE_PAIRS.length + 1; // 3段 + 综合
            var minDistVal = [], maxDistVal = [];
            for (var c = 0; c < nDistCols; c++) {
                var minV = Infinity, maxV = -Infinity;
                for (var r = 0; r < rowData.length; r++) {
                    var v = (c < SLOPE_PAIRS.length) ? rowData[r].dists[c] : rowData[r].dist;
                    if (v < minV) minV = v;
                    if (v > maxV) maxV = v;
                }
                minDistVal.push(minV);
                maxDistVal.push(maxV);
            }

            var html = '<table style="border-collapse:collapse; width:100%; font-size:13px; background:#fff;">';
            html += '<thead><tr style="background:#f5f5f5;">';
            html += '<th style="border:1px solid #ddd; padding:6px 8px;">#</th>';
            html += '<th style="border:1px solid #ddd; padding:6px 8px;">结果</th>';
            for (var s = 0; s < SLOPE_PAIRS.length; s++) {
                html += '<th style="border:1px solid #ddd; padding:6px 8px;">斜率 ' + SLOPE_PAIRS[s].name + '</th>';
            }
            for (var s = 0; s < SLOPE_PAIRS.length; s++) {
                html += '<th style="border:1px solid #ddd; padding:6px 8px;">距离 ' + SLOPE_PAIRS[s].name + '</th>';
            }
            html += '<th style="border:1px solid #ddd; padding:6px 8px;">综合距离</th>';
            html += '</tr></thead><tbody>';

            // 先显示当前比赛
            html += '<tr style="background:#e3f2fd; font-weight:bold;">';
            html += '<td style="border:1px solid #ddd; padding:4px 8px;">当前</td>';
            html += '<td style="border:1px solid #ddd; padding:4px 8px;">—</td>';
            for (var s = 0; s < userSlopes.length; s++) {
                html += '<td style="border:1px solid #ddd; padding:4px 8px; text-align:center;">' + userSlopes[s].toFixed(4) + '</td>';
            }
            for (var s = 0; s < userSlopes.length; s++) {
                html += '<td style="border:1px solid #ddd; padding:4px 8px; text-align:center;">—</td>';
            }
            html += '<td style="border:1px solid #ddd; padding:4px 8px; text-align:center;">—</td>';
            html += '</tr>';

            // 显示所有历史比赛（按距离排序）
            for (var r = 0; r < rowData.length; r++) {
                var d = rowData[r];
                var resColor = SCATTER_RESULT_COLORS[d.result] || '#333';
                html += '<tr>';
                html += '<td style="border:1px solid #ddd; padding:4px 8px;">' + (r + 1) + '</td>';
                html += '<td style="border:1px solid #ddd; padding:4px 8px; color:' + resColor + '; font-weight:bold;">' + d.result + '</td>';
                for (var s = 0; s < d.slopes.length; s++) {
                    html += '<td style="border:1px solid #ddd; padding:4px 8px; text-align:center;">' + d.slopes[s].toFixed(4) + '</td>';
                }
                for (var s = 0; s < d.dists.length; s++) {
                    var v = d.dists[s];
                    var cellBg = '';
                    if (minDistVal[s] < maxDistVal[s]) {
                        if (v === minDistVal[s]) cellBg = 'background:#c8e6c9;';
                        else if (v === maxDistVal[s]) cellBg = 'background:#ffcdd2;';
                    }
                    html += '<td style="border:1px solid #ddd; padding:4px 8px; text-align:center;' + cellBg + '">' + v.toFixed(4) + '</td>';
                }
                var tv = d.dist;
                var totalBg = '';
                if (minDistVal[SLOPE_PAIRS.length] < maxDistVal[SLOPE_PAIRS.length]) {
                    if (tv === minDistVal[SLOPE_PAIRS.length]) totalBg = 'background:#c8e6c9;';
                    else if (tv === maxDistVal[SLOPE_PAIRS.length]) totalBg = 'background:#ffcdd2;';
                }
                html += '<td style="border:1px solid #ddd; padding:4px 8px; text-align:center;' + totalBg + '">' + tv.toFixed(4) + '</td>';
                html += '</tr>';
            }

            html += '</tbody></table>';
            html += '<div style="font-size:11px; color:#888; margin-top:4px;">绿色=最接近当前比赛斜率 红色=最远离当前比赛斜率（相同数值全部标注）</div>';
            wrap.innerHTML = html;
        }

        // 斜率远近结果统计
        function computeSlopeSummaryForRows(rows, matchVals) {
            if (!rows || rows.length === 0) return null;
            var cols = SCATTER_COLS;
            var userSlopes = SLOPE_PAIRS.map(function(sp) {
                return matchVals[cols[sp.b]] - matchVals[cols[sp.a]];
            });
            // 对每个斜率段+综合，找最近和最远的结果类型
            var nCols = SLOPE_PAIRS.length + 1;
            var result = { near: [], far: [] };
            // 先计算每场的各段距离和综合距离
            var rowDists = [];
            for (var i = 0; i < rows.length; i++) {
                var dists = [];
                var distSq = 0;
                for (var s = 0; s < SLOPE_PAIRS.length; s++) {
                    var slope = rows[i][SLOPE_PAIRS[s].b] - rows[i][SLOPE_PAIRS[s].a];
                    var d = Math.abs(slope - userSlopes[s]);
                    dists.push(d);
                    distSq += d * d;
                }
                dists.push(Math.sqrt(distSq)); // 综合
                rowDists.push({ dists: dists, result: rows[i][RESULT_IDX] });
            }
            for (var c = 0; c < nCols; c++) {
                var minV = Infinity, maxV = -Infinity;
                for (var i = 0; i < rowDists.length; i++) {
                    if (rowDists[i].dists[c] < minV) minV = rowDists[i].dists[c];
                    if (rowDists[i].dists[c] > maxV) maxV = rowDists[i].dists[c];
                }
                var nearSet = {}, farSet = {};
                for (var i = 0; i < rowDists.length; i++) {
                    if (rowDists[i].dists[c] === minV) nearSet[rowDists[i].result] = true;
                    if (rowDists[i].dists[c] === maxV) farSet[rowDists[i].result] = true;
                }
                result.near.push(nearSet);
                result.far.push(farSet);
            }
            return result;
        }

        function formatResultSet(set) {
            if (!set) return '0';
            var keys = [];
            if (set['上']) keys.push('<span style="color:#e53935;">上</span>');
            if (set['下']) keys.push('<span style="color:#4caf50;">下</span>');
            if (set['走']) keys.push('<span style="color:#ff9800;">走</span>');
            return keys.length > 0 ? keys.join('') : '0';
        }

        function showSlopeSummary() {
            if (!scatterGroupRows || !scatterCurrentMatch) return;
            var wrap = document.getElementById('slopeSummaryWrap');
            var mv = scatterCurrentMatch.vals;

            // 全数据
            var fullSummary = computeSlopeSummaryForRows(scatterGroupRows, mv);
            // 初筛
            var coarseRows = scatterGroupRows.filter(function(r) {
                return Math.abs(r[2] - mv.L) <= 0.2 && Math.abs(r[4] - mv.U) <= 0.1 && Math.abs(r[5] - mv.X) <= 0.2 && Math.abs(r[6] - mv.Y) <= 0.2;
            });
            var coarseSummary = coarseRows.length > 0 ? computeSlopeSummaryForRows(coarseRows, mv) : null;
            // 细筛
            var fineRows = scatterGroupRows.filter(function(r) {
                return Math.abs(r[2] - mv.L) <= 0.1 && Math.abs(r[4] - mv.U) <= 0.05 && Math.abs(r[5] - mv.X) <= 0.1 && Math.abs(r[6] - mv.Y) <= 0.1;
            });
            var fineSummary = fineRows.length > 0 ? computeSlopeSummaryForRows(fineRows, mv) : null;

            var distLabels = SLOPE_PAIRS.map(function(sp) { return sp.name; });
            distLabels.push('综合');

            var html = '<div style="font-weight:700; font-size:14px; margin-bottom:6px; color:#333;">斜率远近结果统计</div>';
            html += '<table style="border-collapse:collapse; width:100%; font-size:13px; background:#fff;">';
            html += '<thead>';
            // 第一行：大类标题
            html += '<tr style="background:#f5f5f5;">';
            html += '<th style="border:1px solid #ddd; padding:6px 8px;" rowspan="2"></th>';
            html += '<th style="border:1px solid #ddd; padding:6px 8px; text-align:center;" colspan="' + distLabels.length + '">全数据 (' + scatterGroupRows.length + '场)</th>';
            html += '<th style="border:1px solid #ddd; padding:6px 8px; text-align:center;" colspan="' + distLabels.length + '">初筛 (' + coarseRows.length + '场)</th>';
            html += '<th style="border:1px solid #ddd; padding:6px 8px; text-align:center;" colspan="' + distLabels.length + '">细筛 (' + fineRows.length + '场)</th>';
            html += '</tr>';
            // 第二行：各段距离名
            html += '<tr style="background:#f5f5f5;">';
            for (var g = 0; g < 3; g++) {
                for (var c = 0; c < distLabels.length; c++) {
                    html += '<th style="border:1px solid #ddd; padding:4px 6px; font-size:11px; text-align:center;">' + distLabels[c] + '</th>';
                }
            }
            html += '</tr></thead><tbody>';

            // 近距离行
            html += '<tr>';
            html += '<td style="border:1px solid #ddd; padding:4px 8px; font-weight:bold; background:#e8f5e9;">近距离</td>';
            for (var c = 0; c < distLabels.length; c++) {
                html += '<td style="border:1px solid #ddd; padding:4px 8px; text-align:center;">' + (fullSummary ? formatResultSet(fullSummary.near[c]) : '0') + '</td>';
            }
            for (var c = 0; c < distLabels.length; c++) {
                html += '<td style="border:1px solid #ddd; padding:4px 8px; text-align:center;">' + (coarseSummary ? formatResultSet(coarseSummary.near[c]) : '0') + '</td>';
            }
            for (var c = 0; c < distLabels.length; c++) {
                html += '<td style="border:1px solid #ddd; padding:4px 8px; text-align:center;">' + (fineSummary ? formatResultSet(fineSummary.near[c]) : '0') + '</td>';
            }
            html += '</tr>';

            // 远距离行
            html += '<tr>';
            html += '<td style="border:1px solid #ddd; padding:4px 8px; font-weight:bold; background:#ffebee;">远距离</td>';
            for (var c = 0; c < distLabels.length; c++) {
                html += '<td style="border:1px solid #ddd; padding:4px 8px; text-align:center;">' + (fullSummary ? formatResultSet(fullSummary.far[c]) : '0') + '</td>';
            }
            for (var c = 0; c < distLabels.length; c++) {
                html += '<td style="border:1px solid #ddd; padding:4px 8px; text-align:center;">' + (coarseSummary ? formatResultSet(coarseSummary.far[c]) : '0') + '</td>';
            }
            for (var c = 0; c < distLabels.length; c++) {
                html += '<td style="border:1px solid #ddd; padding:4px 8px; text-align:center;">' + (fineSummary ? formatResultSet(fineSummary.far[c]) : '0') + '</td>';
            }
            html += '</tr>';

            html += '</tbody></table>';
            html += '<div style="font-size:11px; color:#888; margin-top:4px;">显示斜率距离最近/最远的历史比赛结果类型（上/下/走），0=无筛选结果</div>';
            wrap.innerHTML = html;
            wrap.style.display = '';
        }

        // 集中度统计：在指定范围内各结果类型占比
        function computeConcentration(rows, dataIdx, userVal, tolerance) {
            var filtered = [];
            if (tolerance === null) {
                filtered = rows;
            } else {
                for (var i = 0; i < rows.length; i++) {
                    if (Math.abs(rows[i][dataIdx] - userVal) <= tolerance) filtered.push(rows[i]);
                }
            }
            var total = filtered.length;
            if (total === 0) return { '上': 0, '下': 0, '走': 0, total: 0 };
            var counts = { '上': 0, '下': 0, '走': 0 };
            for (var i = 0; i < filtered.length; i++) {
                var res = filtered[i][RESULT_IDX];
                if (counts.hasOwnProperty(res)) counts[res]++;
            }
            return {
                '上': Math.round(counts['上'] / total * 100),
                '下': Math.round(counts['下'] / total * 100),
                '走': Math.round(counts['走'] / total * 100),
                total: total
            };
        }

        function renderNormalDistCharts(allRows, matchVals, coarseRows, fineRows) {
            var wrap = document.getElementById('normalDistWrap');
            var grid = document.getElementById('normalDistGrid');
            if (!allRows || allRows.length < 3) { wrap.style.display = 'none'; return; }
            wrap.style.display = '';
            grid.innerHTML = '';

            var keys = ['上', '下', '走'];
            var keyColors = { '上': '#e53935', '下': '#4caf50', '走': '#ff9800' };

            function trendLabel(fromVal, toVal) {
                if (fromVal === 0 && toVal === 0) return '<span style="color:#999;">不变</span>';
                if (toVal > fromVal) return '<span style="color:#e53935; font-weight:bold;">增加</span>';
                if (toVal < fromVal) return '<span style="color:#4caf50; font-weight:bold;">减少</span>';
                return '<span style="color:#999;">不变</span>';
            }

            grid.style.display = 'flex';
            grid.style.flexWrap = 'wrap';
            grid.style.gap = '12px';

            for (var ndi = 0; ndi < NORMDIST_COLS.length; ndi++) {
                var col = NORMDIST_COLS[ndi].col;
                var dataIdx = NORMDIST_COLS[ndi].idx;
                var userVal = matchVals[col];
                var colFull = computeConcentration(allRows, dataIdx, userVal, null);
                var colMid = computeConcentration(allRows, dataIdx, userVal, 0.2);
                var colSmall = computeConcentration(allRows, dataIdx, userVal, 0.1);

                var colRanges = [
                    { label: '全', data: colFull },
                    { label: '中（±0.2）', data: colMid },
                    { label: '小（±0.1）', data: colSmall }
                ];
                var colComparisons = [
                    { label: '全：中', from: colFull, to: colMid },
                    { label: '全：小', from: colFull, to: colSmall },
                    { label: '中：小', from: colMid, to: colSmall }
                ];

                var card = '<div style="border:1px solid #e0e0e0; border-radius:8px; padding:10px; background:#fafafa; flex:1 1 30%; min-width:240px; max-width:33%;">';
                card += '<div style="font-weight:bold; margin-bottom:6px;">' + col + '（' + SCATTER_COL_NAMES[col] + '）</div>';
                card += '<table style="border-collapse:collapse; font-size:12px; width:100%; background:#fff;">';
                card += '<thead><tr style="background:#f5f5f5;">';
                card += '<th style="border:1px solid #ddd; padding:4px 6px;">范围</th>';
                card += '<th style="border:1px solid #ddd; padding:4px 6px;">场数</th>';
                card += '<th style="border:1px solid #ddd; padding:4px 6px; color:' + keyColors['上'] + ';">上盘</th>';
                card += '<th style="border:1px solid #ddd; padding:4px 6px; color:' + keyColors['下'] + ';">下盘</th>';
                card += '<th style="border:1px solid #ddd; padding:4px 6px; color:' + keyColors['走'] + ';">走盘</th>';
                card += '</tr></thead><tbody>';

                for (var ri = 0; ri < colRanges.length; ri++) {
                    var r = colRanges[ri];
                    var d = r.data;
                    card += '<tr>';
                    card += '<td style="border:1px solid #ddd; padding:4px 6px; font-weight:bold;">' + r.label + '</td>';
                    card += '<td style="border:1px solid #ddd; padding:4px 6px; text-align:center;">' + d.total + '</td>';
                    for (var ki = 0; ki < keys.length; ki++) {
                        card += '<td style="border:1px solid #ddd; padding:4px 6px; text-align:center;">' + (d.total > 0 ? d[keys[ki]] + '%' : '—') + '</td>';
                    }
                    card += '</tr>';
                }

                for (var ci = 0; ci < colComparisons.length; ci++) {
                    var cmp = colComparisons[ci];
                    card += '<tr style="background:#f9f9f9;">';
                    card += '<td style="border:1px solid #eee; padding:3px 6px; font-size:11px; color:#666; font-weight:bold;" colspan="2">' + cmp.label + '</td>';
                    for (var ki = 0; ki < keys.length; ki++) {
                        if (cmp.from.total > 0 && cmp.to.total > 0) {
                            card += '<td style="border:1px solid #eee; padding:3px 6px; text-align:center; font-size:11px;">' + trendLabel(cmp.from[keys[ki]], cmp.to[keys[ki]]) + '</td>';
                        } else {
                            card += '<td style="border:1px solid #eee; padding:3px 6px; text-align:center; font-size:11px; color:#999;">—</td>';
                        }
                    }
                    card += '</tr>';
                }

                card += '</tbody></table></div>';
                grid.innerHTML += card;
            }
        }

        // Close modal on overlay click
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('scatterModal').addEventListener('click', function(e) {
                if (e.target === this) closeScatterModal();
            });
            document.addEventListener('keydown', function(e) {
                var scatterM = document.getElementById('scatterModal');
                if (scatterM.classList.contains('show')) {
                    if (e.key === 'Escape') closeScatterModal();
                    if (e.key === 'ArrowLeft') scatterModalNav(-1);
                    if (e.key === 'ArrowRight') scatterModalNav(1);
                }
            });
        });
    </script>
